<!-- Site header: one static black bar on every page. It stays at the top while
     scrolling and looks the same throughout. On phones the links, icons and
     donate link move into a panel opened by the menu button. -->
<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="site-logo" aria-label="Darksoft home">Darksoft</a>

    <button id="menu-toggle" class="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-menu">
      ☰
    </button>

    <div class="site-menu" id="site-menu">
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/discography/">Music</a>
        <a href="/lyrics/">Lyrics</a>
        <a href="/shows/">Shows</a>
        <a href="/merch/">Merch</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
      </nav>

      <div class="site-header-extras">
        <div class="top-social-icons">
{% include social-icons.html %}
        </div>
        <a class="donate-inline" href="/support/">🎸 Buy me picks →</a>
      </div>
    </div>
  </div>
</header>

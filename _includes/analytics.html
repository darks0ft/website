<!--
  Analytics. GitHub Pages builds with JEKYLL_ENV=production, so the real
  Google tag only loads on the live site. Local previews (`jekyll serve`)
  get a stand-in gtag() that logs events to the browser console instead,
  so test visits never show up in Google Analytics.
-->
{% if jekyll.environment == "production" %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5JC54HJC7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-Q5JC54HJC7');
</script>
{% else %}
<script>
  // Local preview: log instead of sending, and flash a note on screen so events
  // can be checked by clicking around. Runs event callbacks so redirects still happen.
  function gtag(type, name, params) {
    if (type !== "event") return;
    params = params || {};
    console.info("[analytics] " + name, params);
    const note = document.createElement("div");
    note.textContent = "📊 " + name + (params.platform ? " · " + params.platform : "") + " · " + params.placement;
    note.style.cssText = "position:fixed;left:12px;bottom:12px;z-index:2147483647;padding:8px 12px;border-radius:8px;" +
      "background:#6dc15b;color:#000;font:13px/1.3 monospace;box-shadow:0 2px 8px rgba(0,0,0,.5)";
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 2500);
    if (typeof params.event_callback === "function") setTimeout(params.event_callback, 0);
  }
</script>
{% endif %}

<!--
  Conversion events (mark these as key events in GA4: Admin → Key events):
    newsletter_signup  sent from the signup handler in footer.html
    bandcamp_click     any link to bandcamp.com
    stream_click       Spotify, Apple Music, YouTube / YouTube Music, Deezer, Pandora, SoundCloud
    merch_click        Printful, Spirit Goth, elasticstage
    donate_click       Buy Me a Coffee, Unstream
    video_play         a click-to-play music video thumbnail (sent from video-player-script.html)
  Each click event carries: platform, link_url, and placement (where on the page it was).
-->
<script>
(function() {
  const RULES = [
    { event: "bandcamp_click", hosts: { "bandcamp.com": "Bandcamp" } },
    { event: "stream_click", hosts: {
        "open.spotify.com": "Spotify", "spotify.com": "Spotify",
        "music.apple.com": "Apple Music",
        "music.youtube.com": "YouTube Music", "youtube.com": "YouTube", "youtu.be": "YouTube",
        "deezer.com": "Deezer", "pandora.com": "Pandora", "soundcloud.com": "SoundCloud" } },
    { event: "merch_click", hosts: {
        "printful.me": "Printful", "spiritgoth.com": "Spirit Goth", "elasticstage.com": "elasticstage" } },
    { event: "donate_click", hosts: {
        "buymeacoffee.com": "Buy Me a Coffee", "unstream.stream": "Unstream" } }
  ];

  // Match a hostname or any of its subdomains (darks0ft.bandcamp.com → bandcamp.com)
  function classify(hostname) {
    const host = hostname.replace(/^www\./, "");
    for (const rule of RULES) {
      for (const domain in rule.hosts) {
        if (host === domain || host.endsWith("." + domain)) return { event: rule.event, platform: rule.hosts[domain] };
      }
    }
    return null;
  }

  // Blocks on album and lyrics pages that have no section id
  const BLOCKS = {
    ".stream-now-box": "lyrics_stream_links",
    ".lyrics-newsletter": "lyrics_newsletter",
    ".video-embed": "lyrics_video",
    ".album-info": "album_buy_stream",
    ".album-tracks": "album_tracklist",
    ".album-credits": "album_credits"
  };

  // Name the part of the page a click came from, so links can be compared by placement
  function placement(el) {
    for (const selector in BLOCKS) {
      if (el.closest(selector)) return BLOCKS[selector];
    }
    if (el.closest("nav, .sticky-nav-bar, .donate-inline")) return "header";
    if (el.closest(".top-social-icons")) return "header_icons";
    if (el.closest("footer")) return "footer";
    if (el.closest("#newsletter-modal")) return "newsletter_popup";
    const section = el.closest("section[id]");
    if (section) return section.id;
    return "main_content";
  }

  document.addEventListener("click", (e) => {
    const link = e.target.closest("a[href]");
    if (!link) return;
    if (link.hasAttribute("data-video-id")) return; // click-to-play thumbnails send video_play instead
    let url;
    try { url = new URL(link.href, location.href); } catch (err) { return; }
    if (url.origin === location.origin) return;

    const match = classify(url.hostname);
    if (!match) return;
    gtag("event", match.event, { platform: match.platform, link_url: url.href, placement: placement(link) });
  }, true);
})();
</script>

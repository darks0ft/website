{% assign sorted_albums = site.data.albums | sort: "release_date" | reverse %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Darksoft Discography",
    "url": {{ page.url | absolute_url | jsonify }},
    "about": { "@type": "MusicGroup", "name": "Darksoft", "url": {{ "/" | absolute_url | jsonify }} },
    "mainEntity": {
      "@type": "ItemList",
      "numberOfItems": {{ sorted_albums | size }},
      "itemListElement": [
        {%- for album in sorted_albums %}
        { "@type": "ListItem", "position": {{ forloop.index }}, "url": {{ "/discography/" | append: album.album_id | append: "/" | absolute_url | jsonify }}, "name": {{ album.album_title | jsonify }} }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  }
  </script>

  blurb: "A direct follow-up to Beigeification, Grayscale looks at a world that seems to be getting less colorful, from clothing and objects to public spaces. The songs swing between questioning that drift toward blandness and making peace with it, landing in a gray area: enjoy the moment, and keep your own color. Neutral in tone but varied in arrangement, it was Darksoft's first album with Spirit Goth Records."

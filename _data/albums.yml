  artwork: Darksoft Brain Album Artwork.jpg
  artwork_artist: Rachel Bennett
  total_tracks: 9
  duration: "35:06"
  blurb: "Darksoft's debut album, named after the first PC computer virus. Most songs take their titles from infamous computer viruses and security flaws (Mydoom, Code Red, ILOVEYOU, Heartbleed), using the language of viruses and algorithms to sing about very human feelings. It's '90s-indebted sadcore from the Pacific Northwest: crunchy guitars and crystalline vocal melodies that cut through the fog."
  credits:
    - "Written and produced by Darksoft"
    - "Mixed and mastered by Mathieu Riede"
    - "Photos by Rachel Bennett"


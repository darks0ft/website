- album_id: cryo
  album_title: Cryo
  release_year: "2022"
  release_date: 2022-01-14
  label: Look Up Records
  spotify: https://open.spotify.com/album/5Y27T3hgkcXG4cCVIqNyZp
  apple_music: https://music.apple.com/us/album/cryo/1592734125
  bandcamp: https://darks0ft.bandcamp.com/album/cryo
  youtube_music: https://music.youtube.com/playlist?list=OLAK5uy_kiZMH7fQ1Hnmjve1Q5IPzEVCoMTz0Tbik
  deezer: https://www.deezer.com/album/269329372
  artwork: Darksoft Cryo Album Artwork.jpeg
  artwork_artist: Owen Blodgett, Jordan Rundle
  total_tracks: 8
  duration: "29:34"
  blurb: "Made mid-pandemic, as Darksoft left Seattle for a new life on the East Coast, Cryo is an album about putting part of yourself on ice: freezing one chapter in place and trying to leave the baggage behind. Half of it was recorded in Seattle and half in Maine, and the songs drift between the two, dreamy alt-rock with a nostalgic, garage-pop edge, cold on the surface and warm underneath. Cryo earned national college radio attention, charting on the NACC and Sub-Modern charts, and its single “Looking Backward” was featured on Spotify's Indie Fresh Finds playlist."
  credits:
    - "Written and recorded by Darksoft"
    - "Mixed by Zak Van Zeumeren"
    - "Mastered by Mike Vernon Davis"
    - "Front cover by Owen Blodgett, back cover by Jordan Rundle"


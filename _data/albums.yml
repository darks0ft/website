  deezer: https://www.deezer.com/album/588064912
  artwork: Darksoft Relativism Album Artwork.jpeg
  artwork_artist: Erica Miller
  total_tracks: 10
  duration: "40:17"
  blurb: "Relativism explores two kinds of relativity. One is personal: taste is subjective and views differ, so live and let live. The other is temporal: time moves differently depending on where you stand, and the days seem to go by faster and faster. The result is whimsical, slightly prophetic dream pop, darkened at the corners like a vignette, about holding on to everyday moments because they don't last."
  credits:
    - "Written and recorded by Darksoft"
    - "Mixed and mastered by Brian Fisher"
    - "Vocals by Kara Auclair on tracks 2, 6, and 9"
    - "Artwork by Erica Miller"

- album_id: rationalism
  album_title: Rationalism
  release_year: "2025"
  release_date: 2025-02-21
  label: Spirit Goth Records
  catalog: SG76
  spotify: https://open.spotify.com/album/7eOL2oXXoh2Ib0r3mHjfXb

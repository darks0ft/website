  blurb: "The follow-up to Brain continues the computer-age concept, naming songs after ransomware, exploits, and security flaws like WannaCry, EternalBlue, and Bad Rabbit (Meltdown itself was a 2018 processor vulnerability). Psych-synth textures, infectious melodies, and '90s alternative rock undertones blend computer-age anxiety with raw human emotion."

  blurb: "A concept album about cycles, repetition, and finding beauty in the mundane, recorded over the course of a year in Darksoft's home studio in Maine. Shimmering, jangly guitars and driving drums meet introspective lyrics about daily routines. The analemma on the cover, made by photographing the sun from the same spot across a year, mirrors the theme. In Darksoft's words: jangly dream pop for the day-to-day. Nothing more, nothing less."
  credits:
    - "Written and recorded by Darksoft"
    - "Mixed and mastered by Brian Fisher"
    - "Vocals by Sandy on “As Above So Below” and Lauren Lakis on “Irons In The Fire”"
    - "Artwork by Jameson Martin"

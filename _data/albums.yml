  artwork: Darksoft Rationalism Album Artwork.jpeg
  artwork_artist: Erica Miller
  total_tracks: 10
  duration: "36:35"
  blurb: "A sister album to Relativism. Where that record dwelt on the subjective and fluid, Rationalism answers with clarity and groundedness: how we come to know things, rationalize them, and process them. The lyrics trace the passage of time, life's unpredictability, and the closeness and distance between people, with a recurring urge to strip away the noise and focus on what matters. Calmer and earnest, it balances color with darkness and energy with ease."
  credits:
    - "Written and recorded by Darksoft"
    - "Mixed and mastered by Brian Fisher"
    - "Vocals by Emily Irving on “Day By Day” and Dutch Experts on “No One Knows”"
    - "Artwork by Erica Miller"


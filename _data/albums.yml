  total_tracks: 9
  duration: "35:55"
  blurb: "A postmodern dose of surfy sounds, beige moods, and pastel phrases to match the disillusionment of the age. Beigeification builds its songs around everyday sayings (“It Is What It Is,” “Such Is Life,” “Win Some Lose Some”), blending dream pop, shoegaze, and alternative rock with velvety vocals. It reached #1 in NACC college radio adds and peaked at #9 on the chart, with cassettes printed by Olympia's 2060 Records."
  credits:
    - "Written and recorded by Darksoft"
    - "Mixed by Brian Fisher"
    - "Mastered by Stefan Mac"
    - "Artwork by Darksoft"


# ================================
#   Darksoft — Jekyll Site Config
# ================================

title: "Darksoft"
description: "Dream pop, indie rock, and philosophical lyrics."

url: "https://www.darksoft.band"   # must match CNAME (www is the live host)
baseurl: ""   # GitHub Pages root

# Permalinks
permalink: pretty   # /path/to/page/ instead of .html

# Enable folders Jekyll would normally ignore
include:
  - lyrics
  - assets
  - .well-known  # ai-catalog.json (agent discovery)
  - _headers     # response headers, read by Cloudflare (ignored by GitHub Pages)

# Build settings
markdown: kramdown
kramdown:
  input: GFM

# Plugins (GitHub Pages–supported only)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Blog: RSS/Atom feed at /feed.xml (byline is always "Darksoft")
author:
  name: "Darksoft"
feed:
  path: feed.xml
  posts_limit: 20

# Output folders
exclude:
  - _blog
  - README.md
  - CLAUDE.local.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json

# Collections (optional future upgrade)
collections:
  tracks:
    output: true
    permalink: /lyrics/:album/:slug/

# Keep unlisted downloads (newsletter reward) out of the sitemap
defaults:
  - scope:
      path: "assets/downloads"
    values:
      sitemap: false
  # Blog posts (_posts/ and _drafts/): see the blog style guide for every field
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      body_class: blog-post-page
      permalink: /blog/:title/
      og_type: article
      head_before: blog-post-before.html
      head_extra: blog-post.html
      sidebar: [listen, newsletter, shows]
